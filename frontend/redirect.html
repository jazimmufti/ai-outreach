<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting — Arclent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #FAF7F2;
            --black: #111827;
            --white: #FFFFFF;
            --discord: #5865F2;
            --font-main: 'DM Sans', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-heading: 'Space Grotesk', system-ui, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-cream);
            color: var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .redirect-card {
            background: var(--white);
            border: 2.5px solid var(--black);
            box-shadow: 6px 6px 0px var(--black);
            border-radius: 6px;
            max-width: 440px;
            width: 100%;
            padding: 32px 28px;
            text-align: center;
        }

        .countdown-circle {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 2.5px solid var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-family: var(--font-heading);
            font-size: 36px;
            font-weight: 800;
            background: #EEF2FF;
            color: var(--discord);
            box-shadow: 3px 3px 0px var(--black);
        }

        .main-countdown {
            font-family: var(--font-heading);
            font-size: 22px;
            font-weight: 800;
            color: var(--black);
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .clipboard-banner {
            background: #DCFCE7;
            border: 2px solid #16A34A;
            color: #15803D;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            padding: 12px 14px;
            border-radius: 6px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 2px 2px 0px rgba(22, 163, 74, 0.4);
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px 20px;
            background: var(--discord);
            color: var(--white);
            font-family: var(--font-heading);
            font-size: 14.5px;
            font-weight: 700;
            text-decoration: none;
            border: 2px solid var(--black);
            box-shadow: 3px 3px 0px var(--black);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-action:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px var(--black);
        }

        .btn-action:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--black);
        }

        .fallback-note {
            margin-top: 14px;
            font-size: 12.5px;
            color: #6B7280;
        }
    </style>
</head>
<body>
    <div class="redirect-card">
        <div class="countdown-circle" id="timer-display">4</div>

        <h1 class="main-countdown">
            Redirecting in <span id="timer-sec">4</span> seconds...
        </h1>

        <div class="clipboard-banner">
            <span>📋 Message copied to clipboard, just click paste in DM</span>
        </div>

        <a id="btn-open-now" href="#" class="btn-action">
            Open Profile ↗
        </a>

        <p class="fallback-note">
            If not redirected automatically, click the button above
        </p>
    </div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const targetUrl = params.get("url") || "https://discord.com";
            const platform = params.get("platform") || "Discord";

            const timerDisplay = document.getElementById("timer-display");
            const timerSec = document.getElementById("timer-sec");
            const btnOpenNow = document.getElementById("btn-open-now");

            btnOpenNow.href = targetUrl;

            if (platform.toLowerCase() !== "discord") {
                btnOpenNow.style.background = "#15803D";
                timerDisplay.style.color = "#15803D";
                timerDisplay.style.background = "#DCFCE7";
            }

            let secondsLeft = 4;
            const interval = setInterval(() => {
                secondsLeft--;
                if (timerDisplay) timerDisplay.textContent = secondsLeft > 0 ? secondsLeft : "🚀";
                if (timerSec) timerSec.textContent = secondsLeft > 0 ? secondsLeft : "0";

                if (secondsLeft <= 0) {
                    clearInterval(interval);
                    try {
                        window.location.replace(targetUrl);
                    } catch (_) {
                        window.location.href = targetUrl;
                    }
                }
            }, 1000);

            btnOpenNow.addEventListener("click", () => {
                clearInterval(interval);
            });
        })();
    </script>
</body>
</html>
